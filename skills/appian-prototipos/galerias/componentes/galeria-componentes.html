}
html, body { height: 100%; }

.site-nav { display: flex; align-items: stretch; gap: 4px; flex: 1; overflow-x: auto; scrollbar-width: none; }
.site-nav button { background: none; border: 0; color: var(--hdr-fg); opacity: .85; padding: 0 14px; cursor: pointer; font-size: 14px; font-weight: 600; border-bottom: 4px solid transparent; border-top: 4px solid transparent; white-space: nowrap; display: flex; align-items: center; gap: 8px; }

.site-user { display: flex; align-items: center; gap: 14px; }
.site-user .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--hdr-hl); color: var(--hdr-bg); font-weight: 700; font-size: 13px; display: grid; place-items: center; }
.site-user .uname { font-size: 13px; opacity: .9; }
.site-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.site-body > * { flex: 1 0 auto; }
.loadbar { height: 3px; background: var(--loading); width: 0; transition: width .35s ease; position: absolute; left: 0; bottom: 0; }

@media (max-width: 760px) { .site-user .uname, .site-brand .dn { display: none; } .site-hdr { gap: 12px; padding: 0 12px; } }

/* a!sidebarTemplate */

.card.link { cursor: pointer; transition: box-shadow .15s, border-color .15s; } .card.link:hover { box-shadow: 0 2px 10px rgba(0,0,0,.14); }
.card .dbar { position: absolute; background: var(--bar, var(--accent)); }

.card .dbar.BOTTOM { left: 0; right: 0; bottom: 0; height: 4px; }

.h-EXTRA_SHORT { min-height: 60px; } .h-SHORT { min-height: 110px; } .h-SHORT_PLUS { min-height: 150px; } .h-MEDIUM { min-height: 200px; } .h-MEDIUM_PLUS { min-height: 260px; } .h-TALL { min-height: 320px; } .h-TALL_PLUS { min-height: 400px; } .h-EXTRA_TALL { min-height: 500px; }
.cgl { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(var(--cw, 260px), 1fr)); }
.cgl.sp-DENSE { gap: 8px; } .cgl.sp-SPARSE { gap: 28px; } .cgl.sp-NONE { gap: 0; }

.sec { display: flex; flex-direction: column; }

.sec-h.dv-ABOVE { border-top: 1px solid var(--dvc, var(--border)); padding-top: 12px; }

.sec-h.fs-SMALL, .sec-h.fs-EXTRA_SMALL { font-weight: 700; letter-spacing: .02em; }
.fs-LARGE_PLUS { font-size: 32px; line-height: 1.2; } .fs-LARGE { font-size: 26px; line-height: 1.25; } .fs-MEDIUM_PLUS { font-size: 21px; line-height: 1.3; } .fs-MEDIUM { font-size: 17px; } .fs-SMALL { font-size: 14px; } .fs-EXTRA_SMALL { font-size: 12px; }
.c-ACCENT { color: var(--accent); } .c-POSITIVE { color: var(--positive); } .c-NEGATIVE { color: var(--negative); } .c-SECONDARY { color: var(--text-2); } .c-WARN { color: var(--warn); } .c-INFO { color: var(--info); } .c-STANDARD { color: inherit; }

.box { border: 1px solid var(--border); background: #fff; }
.box > .box-h { padding: 8px 14px; font-weight: 600; display: flex; gap: 8px; align-items: center; margin: 0; font-size: 14px; }
.box > .box-h.fs-EXTRA_SMALL { font-size: 13px; } .box > .box-h.fs-SMALL { font-size: 14px; } .box > .box-h.fs-MEDIUM { font-size: 17px; } .box > .box-h.fs-MEDIUM_PLUS { font-size: 20px; } .box > .box-h.fs-LARGE { font-size: 24px; }
.box.st-STANDARD > .box-h { background: #eceef0; } .box.st-ACCENT > .box-h { background: var(--accent); color: var(--accent-fg); }
.box.st-SUCCESS > .box-h { background: var(--positive); color: var(--positive-fg); } .box.st-INFO > .box-h { background: var(--info); color: var(--info-fg); }
.box.st-WARN > .box-h { background: var(--warn); color: var(--warn-fg); } .box.st-ERROR > .box-h { background: var(--negative); color: var(--negative-fg); }
.box.shape-SEMI_ROUNDED { border-radius: 6px; overflow: hidden; } .box.shape-ROUNDED { border-radius: 14px; overflow: hidden; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 16px; cursor: pointer; font-weight: 600; color: var(--text-2); white-space: nowrap; display: flex; gap: 8px; align-items: center; }
.tabs button.sel { color: var(--text); border-bottom-color: var(--thl, var(--accent)); }
.tabs button:hover { color: var(--text); }
.tabs.nodiv { border-bottom: 0; }
.tabs { border-bottom-color: var(--tdc, var(--border)); }

.tabl.vert { display: flex; align-items: flex-start; gap: 20px; }

@media (max-width: 760px) { .tabl.vert { display: block; } .tabs.vert { flex-direction: row; border-right: 0; } .tabs.vert button { border-left: 0; border-bottom: 3px solid transparent; } .tabs.vert button.sel { border-bottom-color: var(--thl, var(--accent)); background: none; } }
.lfw-LIGHT { font-weight: 300 !important; } .lfw-REGULAR { font-weight: 400 !important; } .lfw-SEMI_BOLD { font-weight: 600 !important; } .lfw-BOLD { font-weight: 700 !important; }

/* como en Appian, cada panel se desplaza por separado y el layout ocupa la ventana; en las capturas de página completa crece con el contenido */

.bg-WHITE { background: #fff; } .bg-GRAY { background: var(--gray-bg); } .bg-TRANSPARENT { background: transparent; }

.billboard { position: relative; background: var(--bb, #444) center/cover no-repeat; color: #fff; display: flex; }

.ov.st-DARK { background: rgba(0,0,0,.55); } .ov.st-SEMI_DARK { background: rgba(0,0,0,.35); } .ov.st-NONE { background: transparent; } .ov.st-SEMI_LIGHT { background: rgba(255,255,255,.55); color: var(--text); } .ov.st-LIGHT { background: rgba(255,255,255,.85); color: var(--text); }

/* ---------- Field chrome ---------- */

<script type="application/json" id="px-brand">{"id": "appian", "name": "Appian (aspecto estándar)", "source": "Valores por defecto del objeto Site de Appian 26.6: https://docs.appian.com/suite/help/26.6/sites_object.html#navigation-bar y https://docs.appian.com/suite/help/26.6/sites_object.html#branding. Sin logo y sin perfil CSS propio. Paleta, componentes, gráficos y estados: valores neutros del kit a partir de esos colores y de los estándar de Appian, con la auditoría de contraste (references/marca.md).", "site": {"_comment": "Propiedades del objeto Site con sus valores por defecto en Appian 26.6. El equipo de desarrollo las copia tal cual en el Site. Sin logo (en el Site, Logo = None) y con el perfil CSS por defecto (ninguno propio).", "navigationLayout": "HEADER_BAR", "headerBarStyle": "MERCURY", "backgroundColor": "#0f203a", "selectedPageHighlightColor": "#3fa7ce", "accentColor": "#1d659c", "loadingBarColor": "#1d659c", "buttonShape": "SQUARED", "inputShape": "SQUARED", "dialogShape": "SQUARED", "useUppercase": true, "useUppercasePageTitles": true, "showUserMenu": true}, "typeface": {"prototype": "Open Sans", "appian": "Open Sans es la tipografía por defecto de Appian en web. Otra tipografía se configura en Admin Console > Branding > Typefaces, para todos los sites del entorno, o, desde 26.5, en un perfil CSS."}, "palette": {"_comment": "Colores para usar como hex en parámetros SAIL que aceptan hex (fondo de cards y cajas, sellos, barras decorativas, gráficos). Salen del objeto Site y de los colores estándar de Appian; los helpers (scripts/sail_helpers.py) leen navy, slate, steel, red, greenDark, amber, lineStrong, pageBg y grayLight.", "navy": "#0F203A", "accent": "#1D659C", "highlight": "#3FA7CE", "slate": "#666666", "steel": "#426681", "info": "#115EBB", "red": "#B2002C", "greenDark": "#117C00", "amber": "#C36B05", "lineStrong": "#828588", "pageBg": "#F4F5F7", "grayLight": "#E6E8EA", "white": "#FFFFFF"}, "components": {"_comment": "Convenciones de uso de la marca en componentes SAIL (ver references/design-rules.md, basada en el SAIL Design System de Appian)", "primaryButton": {"style": "SOLID", "color": "ACCENT", "_uso": "Un único botón SOLID por pantalla: la acción más frecuente. ACCENT es el color por defecto de Appian"}, "secondaryButton": {"style": "OUTLINE", "color": "ACCENT"}, "destructiveButton": {"style": "GHOST", "color": "NEGATIVE", "_uso": "Borrar o cancelar algo guardado; siempre con confirmHeader/confirmMessage"}, "chartColorScheme": ["#1D659C", "#B35C00", "#0F7B6C", "#0F203A", "#8C564B", "#666666", "#A23B72", "#3FA7CE"], "_chartColorScheme": "Series en este orden: el acento de Appian, ámbar, verde azulado, el azul marino de la barra del site, marrón, gris, magenta y, el último, el color de resaltado. Todas llegan a 3:1 sobre blanco y sobre el gris de página (WCAG 1.4.11) salvo el resaltado #3FA7CE (2,8:1), que solo resalta una serie con etiquetas de datos. Las cinco primeras se distinguen entre sí también con deuteranopía.", "toolbarButton": {"style": "OUTLINE", "color": "SECONDARY", "size": "SMALL", "_uso": "Acciones sobre una parte del contenido (encima de un grid, dentro de una card)"}, "contentCard": {"style": "NONE", "showBorder": false, "showShadow": true, "shape": "SEMI_ROUNDED", "padding": "STANDARD", "_uso": "Cards de contenido sobre fondo gris (headerContentLayout TRANSPARENT). Sobre fondo blanco: showBorder true y sin sombra"}, "pageBackground": {"cardPages": "TRANSPARENT", "forms": "WHITE"}}, "appianSemanticApprox": {"_comment": "Appian no publica los hex de sus colores semánticos: el prototipo usa aproximaciones visuales. En SAIL se usan SIEMPRE los enumerados (POSITIVE, NEGATIVE...), nunca estos hex.", "POSITIVE": "#117C00", "NEGATIVE": "#C8102E", "WARN": "#B35C00", "INFO": "#1664C0", "SECONDARY": "#666666", "STANDARD": "#222222", "bgPositive": "#E8F5E3", "bgNegative": "#FCE8EA", "bgWarn": "#FFF4E0", "bgInfo": "#E6F0FA", "CHARCOAL_SCHEME": "#2E2E35", "NAVY_SCHEME": "#0F203A", "PLUM_SCHEME":   let inspected = null;
