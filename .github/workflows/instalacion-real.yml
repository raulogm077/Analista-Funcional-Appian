# Temporal: instala el bundle real del Dev MCP con `actualizar.py` en Linux y macOS, que en el equipo de Raúl no se puede
# probar. El bundle está en un borrador de versión (no es público) y se borra al terminar. Este fichero también.
name: Instalación real (temporal)

on:
  push:
    branches: [raul/estrategia-actualizaciones-appian]
    paths: [.github/workflows/instalacion-real.yml]

permissions:
  contents: write    # un borrador de versión solo se lee con permiso de escritura

jobs:
  instalar:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: uv
        run: python -m pip install --quiet uv && uv --version
      - name: Bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download bundle-prueba-temporal --dir "$RUNNER_TEMP/bundles" --repo "$GITHUB_REPOSITORY" && ls -la "$RUNNER_TEMP/bundles"
      - name: Instalar el anterior, actualizar al nuevo y repetir
        run: |
          set -u
          export APPIAN_RE_HOME="$RUNNER_TEMP/casa"
          mkdir -p "$APPIAN_RE_HOME"
          A="python skills/appian-actualizacion/scripts/actualizar.py"
          S="$RUNNER_TEMP/servidor"
          C="$RUNNER_TEMP/cliente"
          echo "== sistema: $(uname -s) $(uname -m)"
          for b in anterior.tar.gz nuevo.tar.gz nuevo.tar.gz; do
            echo "== instalar $b"
            $A instalar "$RUNNER_TEMP/bundles/$b" --servidor "$S" --skills-dir "$C"
            echo "== código $?"
          done
          echo "== estado"; $A estado --servidor "$S"; echo "== código $?"
          echo "== informe"; $A informe --servidor "$S" | head -40; echo "== código ${PIPESTATUS[0]}"
          echo "== skill oficial en el cliente dado"; ls "$C/skills/appian" | head -5
          echo "== sail"; (command -v sail && sail --version) || ls -la "$HOME/.local/bin" /usr/local/bin 2>/dev/null | grep -i sail || echo "sail no está en el PATH"
          echo "== servidor arranca"; (cd "$S" && uv run python -c "import lcp_mcp_server; print('lcp_mcp_server importa')") || echo "no importa"
          echo "== fotos"; ls "$APPIAN_RE_HOME/.appian-analisis-funcional/actualizaciones/"*/
