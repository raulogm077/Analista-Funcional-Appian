# Pruebas del plugin, según lo que cambia. No va en el paquete: .github/ es del repositorio.
# - En cada PR, siempre (segundos): la comprobación básica, que mira que las skills encajan y que no hay nada de un
#   cliente.
# - En cada PR que toca el plugin (skills/, pruebas/ y lo demás que no sea documentación): la comprobación completa, en
#   una máquina (Linux, Python 3.12). Las pruebas leen también los textos de las skills, así que un cambio de texto en
#   una skill la pasa igual que uno de script.
# - A mano (Actions → Pruebas → Run workflow), antes de publicar una versión: la completa en Windows, macOS y Linux, con
#   Python 3.9 y 3.12 (Tarea 26), que es cuando importa que los scripts funcionen en el equipo de cualquiera.
# main está protegida: nada entra sin PR, sin estar al día con main ni sin que «Resultado» salga en verde. Con
# `gh pr merge --auto --merge`, GitHub une el PR él solo cuando pasa. Al unir no se vuelve a probar: el PR, al día, ya
# probó su unión con main. Si otro PR entra antes, este se pone al día con `gh pr update-branch` y se prueba otra vez.
name: Pruebas

on:
  pull_request:
  workflow_dispatch:
    inputs:
      medir_paralelo:
        description: "Medir la batería completa con 1 y 2 trabajos (cuatro pasadas adicionales en Linux)"
        type: boolean
        default: false

# Un commit nuevo en la misma rama o PR cancela la ejecución anterior
concurrency:
  group: pruebas-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  basica:
    name: Comprobación básica
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      completa: ${{ steps.alcance.outputs.completa }}
      matriz: ${{ steps.alcance.outputs.matriz }}
    steps:
      # Con todo el historial, para saber qué ficheros cambian
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Las skills encajan entre sí
        run: python pruebas/comprobar_plugin.py

      # Documentación es lo que no va en el plugin ni lo lee ninguna prueba. Todo lo demás (skills/, pruebas/, hooks/,
      # este fichero…) pide la completa; ante la duda, también.
      - name: Qué más hay que pasar
        id: alcance
        shell: bash
        env:
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          SOLO_DOCUMENTACION='^(README\.md|CLAUDE\.md|docs/.*|\.github/assets/.*)$'
          UNA='{"include":[{"os":"ubuntu-latest","python":"3.12","utf8":"1"}]}'
          # La última es un Windows como el de un compañero: sin PYTHONUTF8, la consola y los ficheros sin decir la
          # codificación van en cp1252 (riesgo 2 del plan)
          SIETE='{"include":[{"os":"ubuntu-latest","python":"3.9","utf8":"1"},{"os":"ubuntu-latest","python":"3.12","utf8":"1"},{"os":"windows-latest","python":"3.9","utf8":"1"},{"os":"windows-latest","python":"3.12","utf8":"1"},{"os":"macos-latest","python":"3.9","utf8":"1"},{"os":"macos-latest","python":"3.12","utf8":"1"},{"os":"windows-latest","python":"3.12","utf8":"0"}]}'
          completa=true
          matriz=$UNA
          if [ "$EVENTO" = workflow_dispatch ]; then
            matriz=$SIETE
          else
            cambios=$(git diff --name-only "origin/$BASE...HEAD") || cambios=desconocido
            echo "$cambios"
            if [ -n "$cambios" ] && ! grep -Evq "$SOLO_DOCUMENTACION" <<< "$cambios"; then
              completa=false
            fi
          fi
          echo "completa=$completa"
          echo "completa=$completa" >> "$GITHUB_OUTPUT"
          echo "matriz=$matriz" >> "$GITHUB_OUTPUT"

  completa:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}${{ matrix.utf8 == '0' && ' · consola sin UTF-8' || '' }}
    needs: basica
    if: needs.basica.outputs.completa == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.medir_paralelo)
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.basica.outputs.matriz) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONUTF8: ${{ matrix.utf8 }}
    steps:
      # Las acciones, en su primera versión mayor con Node 24; el docx del Word, con Node 22
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: docx para el Word del DF
        run: npm install -g docx

      - name: Playwright, Chromium y pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright pytest
          python -m playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium

      # mcp pide Python 3.10 o superior: con 3.9, ingeniería inversa se prueba por la vía de uv con 3.12
      - name: mcp (Python 3.10 o superior)
        if: matrix.python != '3.9'
        run: python -m pip install "mcp>=1.2,<2"

      - name: uv para ingeniería inversa (Python 3.9)
        if: matrix.python == '3.9'
        uses: astral-sh/setup-uv@v7

      - name: Comprobación completa del plugin
        env:
          UV_PYTHON: "3.12"
        shell: bash
        run: python pruebas/comprobar_plugin.py --completo 2>&1 | tee "$RUNNER_TEMP/comprobacion.log"; exit ${PIPESTATUS[0]}

      # Los registros de un job no se pueden leer desde la API: si falla, la cola de la salida va en anotaciones.
      # El registro va fuera del repositorio: dentro, comprobar_plugin.py lo leería como parte del paquete.
      - name: La salida, en anotaciones
        if: failure()
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          python - <<'PY'
          import os, pathlib, sys
          sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          t = pathlib.Path(os.environ["RUNNER_TEMP"], "comprobacion.log").read_text(encoding="utf-8", errors="replace")[-9000:]
          for k in range(0, len(t), 3000):
              trozo = t[k:k + 3000].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title=comprobar_plugin {k // 3000 + 1}::{trozo}")
          PY

  pdf:
    name: PDF real con LibreOffice
    needs: basica
    if: needs.basica.outputs.completa == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.medir_paralelo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Instalar docx y LibreOffice
        run: |
          npm install -g docx
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer poppler-utils
          command -v soffice

      - name: Generar y comprobar un PDF del proyecto ficticio
        shell: bash
        run: |
          proyecto="$RUNNER_TEMP/proyecto-pdf"
          cp -R pruebas/appian-functional-analyst/datos/autorizaciones "$proyecto"
          node skills/appian-functional-analyst/scripts/df_docx.js "$proyecto" --pdf 2>&1 | tee "$RUNNER_TEMP/pdf.log"
          pdf="$proyecto/entregables/revision/DF-Solicitudes-de-autorizacion-v1.1.pdf"
          test -s "$pdf"
          pdfinfo "$pdf" | tee "$RUNNER_TEMP/pdfinfo.txt"
          pdftotext "$pdf" "$RUNNER_TEMP/pdf.txt"
          grep -Fq 'Solicitudes de autorización' "$RUNNER_TEMP/pdf.txt"
          grep -Fq 'Objetivo y alcance' "$RUNNER_TEMP/pdf.txt"

      - name: Conservar PDF y resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-real-libreoffice
          path: |
            ${{ runner.temp }}/proyecto-pdf/entregables/revision/*.pdf
            ${{ runner.temp }}/pdf.log
            ${{ runner.temp }}/pdfinfo.txt
            ${{ runner.temp }}/pdf.txt
          if-no-files-found: warn
          retention-days: 14

  medir_paralelo:
    name: Medición manual · 1 frente a 2 trabajos
    needs: basica
    if: needs.basica.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.medir_paralelo
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Preparar el mismo entorno para las cuatro pasadas
        run: |
          npm install -g docx
          python -m pip install --upgrade pip
          python -m pip install playwright pytest "mcp>=1.2,<2"
          python -m playwright install --with-deps chromium

      - name: Medir en orden 1, 2, 2, 1
        shell: bash
        run: |
          : > "$RUNNER_TEMP/medidas.tsv"
          pasada=0
          for trabajos in 1 2 2 1; do
            pasada=$((pasada + 1))
            inicio=$(date +%s)
            set +e
            python pruebas/comprobar_plugin.py --completo --trabajos "$trabajos" 2>&1 | tee "$RUNNER_TEMP/pasada-$pasada.log"
            codigo=${PIPESTATUS[0]}
            set -e
            fin=$(date +%s)
            printf '%s\t%s\t%s\t%s\n' "$pasada" "$trabajos" "$((fin - inicio))" "$codigo" >> "$RUNNER_TEMP/medidas.tsv"
          done
          python - <<'PY'
          import os
          from pathlib import Path

          raiz = Path(os.environ["RUNNER_TEMP"])
          filas = [tuple(map(int, linea.split("\t"))) for linea in (raiz / "medidas.tsv").read_text().splitlines()]
          medias = {n: sum(s for _, modo, s, _ in filas if modo == n) / 2 for n in (1, 2)}
          resumen = ["## Batería completa: serie y paralelo", "", "Mismo commit y runner; orden 1, 2, 2, 1.", "",
                     "| Pasada | Trabajos | Segundos | Código |", "|---:|---:|---:|---:|"]
          resumen += [f"| {i} | {modo} | {segundos} | {codigo} |" for i, modo, segundos, codigo in filas]
          resumen += ["", f"Media serie: {medias[1]:.1f} s; media paralelo: {medias[2]:.1f} s; "
                     f"reducción: {(1 - medias[2] / medias[1]) * 100:.1f} %.",
                     "Los registros de cada pasada incluyen el tiempo por grupo."]
          (raiz / "resumen.md").write_text("\n".join(resumen) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(resumen) + "\n")
          if any(codigo != 0 for _, _, _, codigo in filas):
              raise SystemExit("Al menos una pasada de la batería completa ha fallado")
          PY

      - name: Conservar tiempos y registros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medicion-bateria-linux
          path: |
            ${{ runner.temp }}/medidas.tsv
            ${{ runner.temp }}/resumen.md
            ${{ runner.temp }}/pasada-*.log
          if-no-files-found: warn
          retention-days: 14

  # La única comprobación que exige la protección de main: dice si pasó todo lo que tocaba pasar. La completa cuenta
  # como pasada si no hacía falta (solo documentación).
  resultado:
    name: Resultado
    needs: [basica, completa, pdf, medir_paralelo]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Todo lo que tocaba pasar ha pasado
        shell: bash
        env:
          BASICA: ${{ needs.basica.result }}
          COMPLETA: ${{ needs.completa.result }}
          PDF: ${{ needs.pdf.result }}
          MEDICION: ${{ needs.medir_paralelo.result }}
        run: |
          echo "básica: $BASICA · completa: $COMPLETA · PDF: $PDF · medición: $MEDICION"
          [ "$BASICA" = success ] && { [ "$COMPLETA" = success ] || [ "$COMPLETA" = skipped ]; } && \
            { [ "$PDF" = success ] || [ "$PDF" = skipped ]; } && \
            { [ "$MEDICION" = success ] || [ "$MEDICION" = skipped ]; }
