<svg xmlns="http://www.w3.org/2000/svg" width="900" height="688" viewBox="0 0 900 688" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Cómo trabaja el plugin</title>
  <desc id="descripcion">El analista convierte las fuentes en funcional, técnico y unidades de cambio; cada fuente posterior entra con un informe de impacto. Una aplicación existente pasa antes por ingeniería inversa en solo lectura y, si se rehace, por refactorización. Una extracción parcial conserva la evidencia y declara su alcance. El prototipo aporta capturas al DF en Word que valida el cliente, junto con los diagramas BPMN. Con la unidad aprobada y los objetos del técnico en tabla, se generan issues con dependencias y supuestos. Las piezas compartidas se cambian por turnos entre unidades; las subtareas guardan el avance, pero no cierran ni verifican una issue. Se construye con buenas prácticas; ingeniería inversa verifica objetos, pruebas exigidas y permisos. La aceptación humana de permisos corresponde a una diferencia concreta registrada. El QA recorre los escenarios por rol en otra sesión. Los fallos mantienen pendiente la issue salvo una excepción prevista y justificada. Desde el paquete, los scripts repiten regresión y guiones; una persona revisa el paquete y hace el pase.</desc>
  <style>
    :root {
      --fondo: #f6f8fc; --marco: #dfe4ef; --tarjeta: #ffffff; --borde: #d4dbea; --ficha: #f3f6fc;
      --tinta: #131a30; --suave: #5c6787; --flecha: #8791b0;
      --azul: #2f6fd6; --violeta: #6b4fbb; --verde: #0e8a66; --coral: #d2643f; --cian: #0b7fa5; --gris: #9aa4c0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fondo: #0c1122; --marco: #222b47; --tarjeta: #141b31; --borde: #2a3454; --ficha: #1a2340;
        --tinta: #eef1fb; --suave: #98a3c3; --flecha: #6d78a0;
        --azul: #7fa8ff; --violeta: #b49dff; --verde: #4fd1b0; --coral: #f0906c; --cian: #5cc8e6; --gris: #5f6a8f;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .titulo { font-size: 13px; font-weight: 600; fill: var(--tinta); }
    .nota { font-size: 11px; fill: var(--suave); }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 10.5px; fill: var(--suave); }
    .fichero { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11px; fill: var(--tinta); }
    .rotulo { font-size: 10px; font-weight: 600; letter-spacing: 1.4px; fill: var(--suave); }
    .fondo { fill: var(--fondo); stroke: var(--marco); }
    .tarjeta { fill: var(--tarjeta); stroke: var(--borde); }
    .centro { fill: var(--tarjeta); stroke: var(--azul); stroke-opacity: .6; }
    .ficha { fill: var(--ficha); stroke: var(--borde); }
    .pastilla { fill: var(--fondo); stroke: var(--borde); }
    .linea { fill: none; stroke: var(--flecha); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    .vuelta { stroke-dasharray: 4 4; }
    .frontera { fill: none; stroke: var(--flecha); stroke-width: 1.2; stroke-dasharray: 2 5; stroke-linecap: round; }
    .punta { fill: var(--flecha); }
    .azul { fill: var(--azul); } .violeta { fill: var(--violeta); } .verde { fill: var(--verde); }
    .coral { fill: var(--coral); } .cian { fill: var(--cian); } .gris { fill: var(--gris); }
  </style>

