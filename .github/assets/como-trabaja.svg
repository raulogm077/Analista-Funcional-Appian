<svg xmlns="http://www.w3.org/2000/svg" width="900" height="572" viewBox="0 0 900 572" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Cómo trabaja el plugin</title>
  <desc id="descripcion">Las fuentes del cliente entran al analista funcional, cada una con su informe de impacto. Una aplicación existente pasa antes por ingeniería inversa, que la documenta en as-is en solo lectura, y, si se rehace, por refactorización, que escribe la propuesta. El analista escribe funcional.md, que valida el cliente, tecnico.md, con lo que se construye, y cambios.md, con las unidades que se aprueban. De ahí salen el prototipo navegable, que da las capturas al DF en Word, y los diagramas BPMN. Cuando el jefe de proyecto aprueba una unidad, se escriben sus issues, una por requisito. Cada issue se construye en desarrollo con buenas prácticas y la skill oficial appian, y se verifica con sus casos de prueba. Con todas hechas, el QA recorre la unidad con SAIL CLI como cada rol, en otra sesión, y deja los guiones en qa; un fallo devuelve su issue a pendiente. Desde el paquete no actúa la IA: una persona lo revisa en Compare and Deploy y hace el pase.</desc>
  <style>
