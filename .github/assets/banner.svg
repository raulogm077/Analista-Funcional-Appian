<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Analista funcional Appian: plugin de Claude">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1f4b"/>
      <stop offset="0.55" stop-color="#2a3a8f"/>
      <stop offset="1" stop-color="#2f6fd6"/>
    </linearGradient>
    <linearGradient id="linea" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fb4ff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#8fb4ff" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#fondo)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.06">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200"/>
    <path d="M100 0V300M200 0V300M300 0V300M400 0V300M500 0V300M600 0V300M700 0V300M800 0V300M900 0V300M1000 0V300M1100 0V300"/>
  </g>
  <!-- flujo: fuentes → análisis → Word / técnico / prototipo -->
  <g stroke="url(#linea)" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M860 150 C 910 150, 910 90, 960 90"/>
    <path d="M860 150 H 960" stroke="#8fb4ff" stroke-opacity="0.6"/>
    <path d="M860 150 C 910 150, 910 210, 960 210"/>
    <path d="M704 150 H 768" stroke="#8fb4ff" stroke-opacity="0.6"/>
  </g>
  <g font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">
    <rect x="640" y="128" width="64" height="44" rx="10" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.35"/>
    <text x="672" y="155">Fuentes</text>
    <rect x="768" y="128" width="92" height="44" rx="10" fill="#ffffff" fill-opacity="0.22" stroke="#ffffff" stroke-opacity="0.6"/>
    <text x="814" y="155">Análisis</text>
    <rect x="960" y="70" width="170" height="40" rx="10" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.35"/>
    <text x="1045" y="95">Word para el cliente</text>
    <rect x="960" y="130" width="170" height="40" rx="10" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.35"/>
    <text x="1045" y="155">Especificación técnica</text>
    <rect x="960" y="190" width="170" height="40" rx="10" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.35"/>
    <text x="1045" y="215">Prototipo navegable</text>
  </g>
  <g font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" fill="#ffffff">
    <text x="64" y="118" font-size="20" font-weight="600" fill="#a9c3ff" letter-spacing="3">PLUGIN DE CLAUDE</text>
    <text x="62" y="172" font-size="50" font-weight="700">Analista funcional</text>
    <text x="62" y="226" font-size="50" font-weight="700" fill="#cfe0ff">Appian</text>
    <text x="64" y="262" font-size="18" fill="#ffffff" fill-opacity="0.75">6 skills · del material del cliente a lo que se valida y se construye</text>
  </g>
</svg>
