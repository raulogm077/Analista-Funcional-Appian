    <path d="M0 34V14A14 14 0 0 1 14 0h316a14 14 0 0 1 14 14v20z" fill="#24337E"/>
    <rect x="14" y="9" width="16" height="16" rx="4.5" fill="#FFFFFF"/>
    <rect x="44" y="13" width="46" height="8" rx="4" fill="#FFFFFF" fill-opacity=".92"/>
    <rect x="100" y="13" width="38" height="8" rx="4" fill="#FFFFFF" fill-opacity=".38"/>
    <rect x="148" y="13" width="42" height="8" rx="4" fill="#FFFFFF" fill-opacity=".38"/>
    <circle cx="322" cy="17" r="8" fill="#8DB5FF"/>
    <g fill="#FFFFFF" stroke="#E1E6F2">
      <rect x="14.5" y="46.5" width="98" height="46" rx="8"/>
      <rect x="123.5" y="46.5" width="98" height="46" rx="8"/>
      <rect x="232.5" y="46.5" width="97" height="46" rx="8"/>
      <rect x="14.5" y="104.5" width="315" height="82" rx="8"/>
    </g>
    <g fill="#C3CCE2">
