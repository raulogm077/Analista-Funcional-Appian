    <path d="M14.5 125.5h315" fill="none" stroke="#E1E6F2"/>
    <path d="M26 149.5h292M26 167.5h292" fill="none" stroke="#EEF1F8"/>
    <g fill="#2F6FD6">
      <rect x="26" y="134.5" width="62" height="6" rx="3"/>
      <rect x="26" y="155.5" width="54" height="6" rx="3"/>
      <rect x="26" y="173.5" width="70" height="6" rx="3"/>
    </g>
    <g fill="#CFD6E8">
      <rect x="122" y="134.5" width="58" height="6" rx="3"/>
      <rect x="122" y="155.5" width="70" height="6" rx="3"/>
      <rect x="122" y="173.5" width="46" height="6" rx="3"/>
    </g>
    <rect x="268" y="130.5" width="50" height="14" rx="7" fill="#E2F6EA"/>
    <circle cx="277" cy="137.5" r="3" fill="#1E9E57"/>
    <rect x="284" y="135" width="26" height="5" rx="2.5" fill="#1E9E57" fill-opacity=".5"/>
    <rect x="268" y="151.5" width="50" height="14" rx="7" fill="#FFF3D6"/>
    <circle cx="277" cy="158.5" r="3" fill="#E0962A"/>
    <rect x="284" y="156" width="26" height="5" rx="2.5" fill="#E0962A" fill-opacity=".5"/>
    <rect x="268" y="169.5" width="50" height="14" rx="7" fill="#EAF1FF"/>
