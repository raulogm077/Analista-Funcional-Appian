<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Analista funcional Appian, plugin de Claude: del material del cliente al DF en Word, los procesos BPMN y el prototipo navegable">
  <defs>
    <clipPath id="marco"><rect width="1280" height="400" rx="24"/></clipPath>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E21"/>
      <stop offset="1" stop-color="#131B45"/>
    </linearGradient>
    <radialGradient id="luzAzul" gradientUnits="userSpaceOnUse" cx="1010" cy="30" r="560">
      <stop offset="0" stop-color="#3D7DFF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#3D7DFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="luzVioleta" gradientUnits="userSpaceOnUse" cx="690" cy="440" r="420">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity=".32"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="luzCoral" gradientUnits="userSpaceOnUse" cx="1260" cy="410" r="320">
      <stop offset="0" stop-color="#E8825A" stop-opacity=".34"/>
      <stop offset="1" stop-color="#E8825A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="puntos" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#FFFFFF" fill-opacity=".10"/>
    </pattern>
    <linearGradient id="velo" x1="0" y1="0" x2="1" y2="0">
      <stop offset=".38" stop-color="#000000"/>
      <stop offset=".8" stop-color="#FFFFFF"/>
    </linearGradient>
    <mask id="aLaDerecha" maskUnits="userSpaceOnUse" x="0" y="0" width="1280" height="400">
      <rect width="1280" height="400" fill="url(#velo)"/>
    </mask>
    <linearGradient id="tinta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8DB5FF"/>
      <stop offset="1" stop-color="#C5A8FF"/>
    </linearGradient>
    <filter id="sombra" x="-25%" y="-25%" width="150%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#02040F" flood-opacity=".55"/>
    </filter>
  </defs>

  <g clip-path="url(#marco)">
    <rect width="1280" height="400" fill="url(#base)"/>
    <rect width="1280" height="400" fill="url(#luzAzul)"/>
    <rect width="1280" height="400" fill="url(#luzVioleta)"/>
    <rect width="1280" height="400" fill="url(#luzCoral)"/>
    <rect width="1280" height="400" fill="url(#puntos)" mask="url(#aLaDerecha)"/>
  </g>
  <rect x=".5" y=".5" width="1279" height="399" rx="23.5" fill="none" stroke="#FFFFFF" stroke-opacity=".10"/>

  <!-- Lo que sale: el DF en Word -->
  <g transform="translate(762 50) rotate(-6 95 126)" filter="url(#sombra)">
    <rect width="190" height="252" rx="12" fill="#FFFFFF"/>
    <rect x="16" y="16" width="36" height="20" rx="6" fill="#2F6FD6"/>
    <text x="34" y="30.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">DF</text>
    <rect x="60" y="22" width="44" height="8" rx="4" fill="#D9E0F0"/>
    <rect x="16" y="54" width="122" height="10" rx="5" fill="#1B2343"/>
    <rect x="16" y="72" width="80" height="6" rx="3" fill="#B7C1DC"/>
    <g fill="#E3E8F3">
      <rect x="16" y="94" width="158" height="5" rx="2.5"/>
      <rect x="16" y="105" width="150" height="5" rx="2.5"/>
      <rect x="16" y="116" width="158" height="5" rx="2.5"/>
      <rect x="16" y="127" width="102" height="5" rx="2.5"/>
    </g>
    <rect x="16.5" y="148.5" width="157" height="58" rx="6" fill="#FFFFFF" stroke="#D6DDEE"/>
    <path d="M16.5 164.5v-10a6 6 0 0 1 6-6h145a6 6 0 0 1 6 6v10z" fill="#EEF3FF" stroke="#D6DDEE"/>
    <path d="M16.5 178.5h157M16.5 192.5h157M69 148.5v58M121 148.5v58" fill="none" stroke="#D6DDEE"/>
    <circle cx="27" cy="228" r="10" fill="#E2F6EA"/>
    <path d="M22.5 228.2l3.2 3.2 6-6.6" fill="none" stroke="#1E9E57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="44" y="224" width="74" height="8" rx="4" fill="#BFE7CE"/>
  </g>

