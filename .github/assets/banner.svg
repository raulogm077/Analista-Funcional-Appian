    <path d="M70 83l8-6 8 3 8-11 8 3" fill="none" stroke="#2F6FD6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="133" y="68" width="26" height="14" rx="3.5" fill="#1E9E57"/>
    <g fill="#9ADBB7">
      <rect x="172" y="76" width="5" height="8" rx="1.5"/>
      <rect x="180" y="71" width="5" height="13" rx="1.5"/>
      <rect x="188" y="74" width="5" height="10" rx="1.5"/>
      <rect x="196" y="66" width="5" height="18" rx="1.5"/>
