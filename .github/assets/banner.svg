  <!-- Título -->
  <rect x="72.5" y="78.5" width="226" height="34" rx="17" fill="#FFFFFF" fill-opacity=".07" stroke="#FFFFFF" stroke-opacity=".18"/>
  <circle cx="93" cy="95.5" r="5" fill="#E8825A"/>
  <text x="108" y="100.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="600" letter-spacing="2.2" fill="#D6DEF6">PLUGIN DE CLAUDE</text>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
    <text x="70" y="192" font-size="60" font-weight="700" letter-spacing="-1.4" fill="#FFFFFF">Analista funcional</text>
    <text x="70" y="260" font-size="60" font-weight="700" letter-spacing="-1.4" fill="url(#tinta)">Appian</text>
    <text x="72" y="310" font-size="20" fill="#B3BEDD">Del material del cliente a lo que se valida y se construye.</text>
  </g>
