    <rect x="10" y="84" width="4" height="24" rx="2" fill="#B7C1DC"/>
    <g fill="none" stroke="#6B7699" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M57 32h12M134 32h10M178 32h18M164 46v50h19"/>
    </g>
    <g fill="#6B7699">
      <path d="M75 32l-6.5-3.5v7zM149.5 32l-6.5-3.5v7zM202.5 32l-6.5-3.5v7zM189.5 96l-6.5-3.5v7z"/>
    </g>
    <circle cx="48" cy="32" r="9" fill="#E2F6EA" stroke="#1E9E57" stroke-width="2"/>
    <rect x="76" y="18" width="58" height="28" rx="6" fill="#EAF1FF" stroke="#2F6FD6" stroke-width="1.6"/>
    <rect x="86" y="27" width="38" height="4" rx="2" fill="#9DBBF2"/>
    <rect x="86" y="34" width="24" height="4" rx="2" fill="#C6D8F8"/>
    <path d="M164 18l14 14-14 14-14-14z" fill="#FFF3D6" stroke="#E0962A" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M159.8 27.8l8.4 8.4M168.2 27.8l-8.4 8.4" fill="none" stroke="#E0962A" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="212" cy="32" r="8.4" fill="#FDE8E8" stroke="#D64545" stroke-width="3.2"/>
    <rect x="190" y="82" width="50" height="28" rx="6" fill="#F1ECFF" stroke="#7C5CFF" stroke-width="1.6"/>
    <rect x="199" y="91" width="32" height="4" rx="2" fill="#BFAEF7"/>
    <rect x="199" y="98" width="20" height="4" rx="2" fill="#DAD0FB"/>
  </g>

