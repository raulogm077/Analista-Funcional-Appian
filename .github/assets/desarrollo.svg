<svg xmlns="http://www.w3.org/2000/svg" width="900" height="144" viewBox="0 0 900 144" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Cómo se cambia el plugin</title>
  <desc id="descripcion">Siete pasos: git pull, cambios con Claude Code, probar con --plugin-dir, pasar las pruebas con --completo, subir la versión en plugin.json, push a main y, con eso, la versión le llega al equipo.</desc>
  <style>
    :root {
      --fondo: #f6f8fc; --marco: #dfe4ef; --tarjeta: #ffffff; --via: #bcc6dd;
      --tinta: #131a30; --suave: #5c6787; --azul: #2f6fd6; --verde: #0e8a66; --sobre-verde: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fondo: #0c1122; --marco: #222b47; --tarjeta: #141b31; --via: #3d4a75;
        --tinta: #eef1fb; --suave: #98a3c3; --azul: #7fa8ff; --verde: #4fd1b0; --sobre-verde: #0c1122;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; text-anchor: middle; }
    .titulo { font-size: 13px; font-weight: 600; fill: var(--tinta); }
    .nota { font-size: 11px; fill: var(--suave); }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 10.5px; fill: var(--suave); }
    .numero { font-size: 12px; font-weight: 700; fill: var(--azul); }
    .fondo { fill: var(--fondo); stroke: var(--marco); }
    .paso { fill: var(--tarjeta); stroke: var(--azul); stroke-width: 1.5; }
    .fin { fill: var(--verde); }
    .via { fill: none; stroke: var(--via); stroke-width: 2; stroke-linecap: round; }
    .visto { fill: none; stroke: var(--sobre-verde); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect class="fondo" x=".5" y=".5" width="899" height="143" rx="14"/>

  <path class="via" d="M92 52h82M218 52h84M346 52h82M472 52h82M598 52h84M726 52h82"/>

  <circle class="paso" cx="70" cy="52" r="15"/>
  <text class="numero" x="70" y="56.3">1</text>
  <text class="titulo" x="70" y="96">Al día</text>
  <text class="mono" x="70" y="115">git pull</text>

  <circle class="paso" cx="196" cy="52" r="15"/>
  <text class="numero" x="196" y="56.3">2</text>
  <text class="titulo" x="196" y="96">Cambios</text>
  <text class="nota" x="196" y="115">con Claude Code</text>

  <circle class="paso" cx="324" cy="52" r="15"/>
  <text class="numero" x="324" y="56.3">3</text>
  <text class="titulo" x="324" y="96">Probar</text>
  <text class="mono" x="324" y="115">--plugin-dir .</text>

  <circle class="paso" cx="450" cy="52" r="15"/>
  <text class="numero" x="450" y="56.3">4</text>
  <text class="titulo" x="450" y="96">Pruebas</text>
  <text class="mono" x="450" y="115">--completo</text>

  <circle class="paso" cx="576" cy="52" r="15"/>
  <text class="numero" x="576" y="56.3">5</text>
  <text class="titulo" x="576" y="96">Versión</text>
  <text class="mono" x="576" y="115">plugin.json</text>

  <circle class="paso" cx="704" cy="52" r="15"/>
  <text class="numero" x="704" y="56.3">6</text>
  <text class="titulo" x="704" y="96">Push</text>
  <text class="nota" x="704" y="115">a main</text>

  <circle class="fin" cx="830" cy="52" r="16"/>
  <path class="visto" d="M823 52.3l4.8 4.8 9-9.8"/>
  <text class="titulo" x="830" y="96">Al equipo</text>
  <text class="nota" x="830" y="115">con auto-update</text>
</svg>
