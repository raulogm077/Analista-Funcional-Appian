<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Cómo se cambia el plugin</title>
  <desc id="descripcion">Actualizar con git pull, cambiar en una rama, probar el comportamiento con claude --plugin-dir y pasar las comprobaciones correspondientes antes del commit. Abrir el PR con autorización. GitHub ejecuta la batería y la conversión real a PDF; la integración requiere pruebas en verde y aprobación. Antes de publicar, pasar las siete combinaciones de sistema y Python, comprobar los enlaces y probar el paquete. Con autorización, actualizar la versión en el manifiesto y el manual y publicar la release. El equipo recibe la versión mediante auto-update.</desc>
  <style>
    :root {
      --fondo: #f6f8fc; --marco: #dfe4ef; --tarjeta: #ffffff; --via: #bcc6dd;
      --tinta: #131a30; --suave: #5c6787; --azul: #2f6fd6; --verde: #0e8a66; --sobre-verde: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fondo: #0c1122; --marco: #222b47; --tarjeta: #141b31; --via: #3d4a75;
        --tinta: #eef1fb; --suave: #98a3c3; --azul: #7fa8ff; --verde: #4fd1b0; --sobre-verde: #0c1122;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; text-anchor: middle; }
    .titulo { font-size: 13px; font-weight: 600; fill: var(--tinta); }
    .rotulo { font-size: 10px; font-weight: 600; letter-spacing: 1.1px; fill: var(--suave); }
    .nota { font-size: 11px; fill: var(--suave); }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 10.5px; fill: var(--suave); }
    .numero { font-size: 12px; font-weight: 700; fill: var(--azul); }
    .fondo { fill: var(--fondo); stroke: var(--marco); }
    .paso { fill: var(--tarjeta); stroke: var(--azul); stroke-width: 1.5; }
    .fin { fill: var(--verde); }
    .via { fill: none; stroke: var(--via); stroke-width: 2; stroke-linecap: round; }
    .visto { fill: none; stroke: var(--sobre-verde); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect class="fondo" x=".5" y=".5" width="899" height="259" rx="14"/>

  <path class="via" d="M82 52h68M193 52h68M304 52h68M415 52h68M526 52h68M637 52h68M748 52h67"/>

  <circle class="paso" cx="60" cy="52" r="15"/>
  <text class="numero" x="60" y="56.3">1</text>
  <text class="titulo" x="60" y="96">Al día</text>
  <text class="mono" x="60" y="115">git pull</text>

  <circle class="paso" cx="171" cy="52" r="15"/>
  <text class="numero" x="171" y="56.3">2</text>
  <text class="titulo" x="171" y="96">Cambios</text>
  <text class="nota" x="171" y="115">en una rama</text>

  <circle class="paso" cx="282" cy="52" r="15"/>
  <text class="numero" x="282" y="56.3">3</text>
  <text class="titulo" x="282" y="96">Probar</text>
  <text class="mono" x="282" y="115">--plugin-dir</text>

  <circle class="paso" cx="393" cy="52" r="15"/>
  <text class="numero" x="393" y="56.3">4</text>
  <text class="titulo" x="393" y="96">Comprobar</text>
  <text class="nota" x="393" y="115">antes del commit</text>

  <circle class="paso" cx="504" cy="52" r="15"/>
  <text class="numero" x="504" y="56.3">5</text>
  <text class="titulo" x="504" y="96">Commit</text>
  <text class="nota" x="504" y="115">trabajo probado</text>

  <circle class="paso" cx="615" cy="52" r="15"/>
  <text class="numero" x="615" y="56.3">6</text>
  <text class="titulo" x="615" y="96">PR</text>
  <text class="nota" x="615" y="115">con autorización</text>

  <circle class="paso" cx="726" cy="52" r="15"/>
  <text class="numero" x="726" y="56.3">7</text>
  <text class="titulo" x="726" y="96">CI del PR</text>
  <text class="nota" x="726" y="115">batería + PDF real</text>

  <circle class="fin" cx="838" cy="52" r="16"/>
  <path class="visto" d="M831 52.3l4.8 4.8 9-9.8"/>
  <text class="titulo" x="838" y="96">Integrar</text>
  <text class="nota" x="838" y="115">verde y aprobado</text>
  <path class="via" d="M854 52H890V139H159V149"/>
  <path d="M159 152l-3.5-7h7z" fill="var(--via)"/>
  <rect class="fondo" x="20.5" y="155.5" width="859" height="66" rx="10"/>
  <text class="rotulo" x="159" y="179">ANTES DE PUBLICAR</text>
  <text class="nota" x="159" y="201">7 combinaciones · enlaces · paquete</text>
  <path class="via" d="M296 188H347"/>
  <path d="M353 188l-7-3.5v7z" fill="var(--via)"/>
  <text class="titulo" x="463" y="179">Publicar versión</text>
  <text class="nota" x="463" y="201">manifiesto, manual y release</text>
  <path class="via" d="M577 188H628"/>
  <path d="M634 188l-7-3.5v7z" fill="var(--via)"/>
  <text class="titulo" x="751" y="179">Llega al equipo</text>
  <text class="nota" x="751" y="201">auto-update al abrir Claude Code</text>
  <text class="nota" x="450" y="242">Integrar y publicar requieren autorización y las comprobaciones en verde.</text>
</svg>
